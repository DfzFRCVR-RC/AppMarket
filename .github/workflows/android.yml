name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Signing Key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: appmarket-keystore-v1

      - name: Create Signing Key
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair \
            -keystore keystore.jks \
            -alias appmarket \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storetype PKCS12 \
            -storepass AppMarket2026 \
            -keypass AppMarket2026 \
            -dname "CN=AppMarket, OU=Dev, O=DfzFRCVR, L=CN, ST=CN, C=CN"
          echo "✅ 已生成签名证书"

      - name: Build Release APK
        run: |
          ./gradlew :app:android:assembleRelease
          APK=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::没有产出 APK"
            exit 1
          fi
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: AppMarket2026
          KEY_ALIAS: appmarket
          KEY_PASSWORD: AppMarket2026

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY